<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — JumpStart</title>
<style>
  @font-face{font-family:'Forevs';src:url('/wiki/lib/tpl/bootstrap3/fonts/ForevsDemo-Bold.otf') format('opentype');font-weight:bold;}
  @font-face{font-family:'Radiance';src:url('/wiki/lib/tpl/bootstrap3/fonts/radiance-semibold.otf') format('opentype');font-weight:600;}
  @font-face{font-family:'Radiance';src:url('/wiki/lib/tpl/bootstrap3/fonts/radiance-regular.otf') format('opentype');font-weight:400;}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  html,body,.dokuwiki,#dokuwiki__site,#dokuwiki__top,
  .dw-container,main.dw-container,.panel.panel-default,
  .panel-body,article#dokuwiki__content,.col-sm-12,.col-md-12,.row{
    background:transparent !important;border:none !important;
    box-shadow:none !important;padding:0 !important;margin:0 !important;
    min-height:0 !important;height:auto !important;
  }

  #dw__breadcrumbs,#dokuwiki__pageheader,.tools.panel.panel-default,
  p.text-right,.small.text-right,#dokuwiki__footer,footer{
    display:none !important;
  }

  html,body{
    background:#0a0716 !important;color:#EDE8F5;
    font-family:'Radiance',sans-serif;
    width:100%;height:100% !important;overflow:hidden !important;
  }

  /* Fixed layer below navbar, perfectly centered */
  .auth-page{
    position:fixed;
    top:70px;left:0;right:0;bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a0716;
    z-index:500;
    overflow-y:auto;
  }

  .auth-page::before{
    content:'';position:fixed;
    top:70px;left:0;right:0;bottom:0;
    pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 80% 70% at 50% 50%, rgba(107,79,187,0.11) 0%, transparent 70%);
  }

  .auth-card{
    width:100%;max-width:620px;
    position:relative;z-index:1;
    padding:32px 0;
  }

  .auth-header{margin-bottom:48px;text-align:center;}

  .auth-logo{
    font-family:'Forevs',serif;font-size:2.2rem;font-weight:bold;
    letter-spacing:0.14em;color:#6B4FBB;text-transform:uppercase;
    margin-bottom:28px;display:block;text-decoration:none;
    text-shadow:0 0 30px rgba(107,79,187,0.5);
  }

  .auth-title{
    font-family:'Forevs',serif;font-size:4.2rem;font-weight:bold;
    letter-spacing:0.06em;color:#ffffff;line-height:1;
    text-shadow:0 0 40px rgba(107,79,187,0.3);
    margin-bottom:14px;
  }

  .auth-subtitle{
    font-size:1.4rem;color:rgba(184,173,219,0.4);letter-spacing:0.04em;
  }

  .auth-form{
    background:rgba(14,10,30,0.7);
    border:1px solid rgba(107,79,187,0.15);
    border-radius:4px;
    padding:44px;
  }

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:24px;}
  .field-row.full{grid-template-columns:1fr;}

  .field{display:flex;flex-direction:column;gap:10px;}

  .field-label{
    font-size:1.2rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;
    color:rgba(184,173,219,0.6);
  }

  .field-input{
    background:rgba(10,7,22,0.7);
    border:1px solid rgba(107,79,187,0.25);
    border-radius:3px;padding:16px 22px;
    font-family:'Radiance',sans-serif;font-size:1.4rem;font-weight:400;
    color:#EDE8F5;outline:none;width:100%;
    transition:border-color 0.15s ease,box-shadow 0.15s ease;
  }
  .field-input:focus{border-color:rgba(107,79,187,0.6);box-shadow:0 0 0 3px rgba(107,79,187,0.1);}
  .field-input::placeholder{color:rgba(184,173,219,0.22);}

  .field-divider{height:1px;background:rgba(107,79,187,0.1);margin:26px 0;}

  .remember-row{
    display:flex;align-items:center;gap:14px;margin:26px 0;
  }
  .remember-row input[type=checkbox]{
    width:22px;height:22px;accent-color:#6B4FBB;cursor:pointer;flex-shrink:0;
  }
  .remember-row label{
    font-size:1.3rem;color:rgba(184,173,219,0.6);cursor:pointer;
  }

  .btn-submit{
    width:100%;padding:19px;
    background:rgba(107,79,187,0.7);border:1px solid rgba(107,79,187,0.8);
    border-radius:3px;
    font-family:'Radiance',sans-serif;font-size:1.25rem;font-weight:600;
    letter-spacing:0.2em;text-transform:uppercase;
    color:#EDE8F5;cursor:pointer;transition:all 0.15s ease;
    margin-top:30px;
  }
  .btn-submit:hover{background:#6B4FBB;box-shadow:0 0 20px rgba(107,79,187,0.4);}

  .auth-links{
    display:flex;flex-direction:column;gap:14px;
    margin-top:26px;text-align:center;
  }

  .auth-link{font-size:1.25rem;color:rgba(184,173,219,0.45);}
  .auth-link a{color:#6B4FBB;text-decoration:none;transition:color 0.15s ease;}
  .auth-link a:hover{color:#B8ADDB;}

  .auth-error{
    background:rgba(100,30,30,0.5);border:1px solid rgba(180,60,60,0.3);
    border-radius:3px;padding:16px 22px;margin-bottom:26px;
    font-size:1.2rem;color:rgba(240,180,180,0.9);
  }

  .auth-notice{
    background:rgba(107,79,187,0.07);border:1px solid rgba(107,79,187,0.15);
    border-radius:3px;padding:16px 22px;margin-bottom:26px;
    font-size:1.2rem;color:rgba(184,173,219,0.5);line-height:1.5;
  }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a class="auth-logo" href="/wiki/doku.php">JumpStart</a>
      <div class="auth-title">Welcome back</div>
      <div class="auth-subtitle">Sign in to your account</div>
    </div>
    <div class="auth-form">
      __ERROR__
      <form method="post" action="/wiki/doku.php" accept-charset="UTF-8">
        <input type="hidden" name="do" value="login">
        <input type="hidden" name="sectok" value="__SECTOK__">
        <input type="hidden" name="id" value="__PAGE_ID__">
        <div class="field-row full">
          <div class="field">
            <label class="field-label" for="login__user">Username</label>
            <input class="field-input" id="login__user" name="u" type="text" autocomplete="username" autofocus>
          </div>
        </div>
        <div class="field-row full">
          <div class="field">
            <label class="field-label" for="login__password">Password</label>
            <input class="field-input" id="login__password" name="p" type="password" autocomplete="current-password">
          </div>
        </div>
        <div class="remember-row">
          <input type="checkbox" id="login__remember" name="r" value="1">
          <label for="login__remember">Remember me</label>
        </div>
        <button class="btn-submit" type="submit">Log In</button>
      </form>
    </div>
    <div class="auth-links">
      <span class="auth-link">No account? <a href="/wiki/doku.php?do=register">Register</a></span>
      <span class="auth-link">Forgot your password? <a href="/wiki/doku.php?do=resendpwd">Reset it</a></span>
    </div>
  </div>
</div>
</body>
</html>
